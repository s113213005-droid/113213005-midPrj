<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>待審查投稿</title>
    <link rel="stylesheet" href="/www/style.css">
</head>
<body>
    <h1>待審查投稿清單</h1>

    <table>
        <tr>
            <th>編號</th>
            <th>作者</th>
            <th>類別</th>
            <th>標題</th>
            <th></th>
        </tr>

        {% for item in submissions %}
        <tr>
            <td style="text-align:center">{{ item.id }}</td>
            <td>{{ item.author }}</td>
            <td>{{ item.category }}</td>
            <td>{{ item.title }}</td>
            <td>
                <a href="/editor/submissions/{{ item.id }}" class="btn btn-review">
                    審查稿件
                </a>
            </td>
        </tr>
        {% else %}
        <tr>
            <td colspan="5">目前沒有待審查的投稿</td>
        </tr>
        {% endfor %}
    </table>
</body>
<style>
table{
   border-spacing: 15px;
   }
a {
text-decoration: none;
}
</style>
</html>
