
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>我的投稿</title>
</head>

<body>

    <h1>我的投稿列表</h1>

    <a href="/author/submissions/new">
        <button>新增投稿</button>
    </a>

    <table>
        <tr>
            <th>編號</th>
            <th>類別</th>
            <th>標題</th>
            <th>狀態</th>
            <th style="text-align:left">操作</th>
        </tr>

        {% for item in submissions %}
        <tr>
            <td style="text-align:center">{{ item.id }}</td>
            <td>{{ item.category }}</td>
            <td>{{ item.title }}</td>
            <td>{{ item.status }}</td>
            <td>
				{% if item.status == '編輯中' %}

					<a href="/author/submissions/edit/{{ item.id }}" class="btn">
						修改
					</a>

					<form action="/author/submissions/delete/{{ item.id }}"
						  method="post"
						  style="display:inline;">
						<button type="submit"
								onclick="return confirm('確定刪除這篇投稿嗎？')">
							刪除
						</button>
					</form>

					<form action="/author/submissions/submit/{{ item.id }}"
						  method="post"
						  style="display:inline;">
						<button type="submit"
								onclick="return confirm('確定要送出審查嗎？')">
							送出審查
						</button>
					</form>

				{% else %}
					不可修改
				{% endif %}
			</td>
        </tr>
        {% else %}
        <tr>
            <td colspan="5">目前沒有投稿資料</td>
        </tr>
        {% endfor %}
    </table>

</body>
<style>
table{
   border-spacing: 15px;
   }
a {
text-decoration: none;
}
.btn{
display: inline-block;
    text-decoration: none;
    color: #000000;
    background-color: #f0f0f0;
    border: 1px solid #767676;
    border-radius: 3px;
    padding: 1.5px 6px;
    font-size: 14px;
    font-family: Arial, sans-serif;
    user-select: none;
  }

  .btn-default:hover {
    background-color: #e5e5e5;
    border-color: #4f4f4f;
  }

  .btn-default:active {
    background-color: #d5d5d5;
    border-color: #2c2c2c;
  }
</style>
</html>
