<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投稿審查系統</title>
    <link rel="stylesheet" href="/www/style.css">
</head>
<body>

    <main class="container" style="text-align:center;">
        <h1>投稿與稿件審查系統</h1>
        <p>請選擇使用身分</p>

        <div class="role-container">

            <div class="role-card">
                <h2>作者</h2>
                <p>管理自己的投稿與稿件</p>
                <a href="/author/submissions" class="button">
                    進入作者頁面
                </a>
            </div>

            <div class="role-card">
                <h2>編輯</h2>
                <p>查看及審查投稿內容</p>
                <a href="/editor/submissions" class="button">
                    進入編輯頁面
                </a>
            </div>

        </div>
    </main>

</body>
</html>
