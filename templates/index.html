<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投稿審查系統</title>
    <link rel="stylesheet" href="/www/style.css">
</head>
<body>

    <main class="container" style="text-align:center;">
        <h1>投稿與稿件審查系統</h1>
        <p>請選擇使用身分</p>

        <div class="role-container">

            <div class="role-card">
                <h2>作者</h2>
                <p>管理自己的投稿與稿件</p>
                <a href="/author/submissions" class="button">
                    進入作者頁面
                </a>
            </div>

            <div class="role-card">
                <h2>編輯</h2>
                <p>查看及審查投稿內容</p>
                <a href="/editor/submissions" class="button">
                    進入編輯頁面
                </a>
            </div>

        </div>
    </main>

</body>
<style>

.role-container {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-top: 40px;
    flex-wrap: wrap;
}

.role-card {
    width: 250px;
    padding: 30px;
    border: 1px solid #ddd;
    border-radius: 12px;
    text-align: center;
    background-color: white;
}

.button {
    display: inline-block;
    padding: 10px 20px;
    margin-top: 15px;
    background-color: #3b82f6;
    color: white;
    text-decoration: none;
    border-radius: 6px;
}

.button:hover {
    background-color: #2563eb;
}</style>
</html>
